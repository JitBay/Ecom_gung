version: '3.8'

services:
  app:
    image: ghcr.io/${IMAGE_REPO:-jitbay/ecom_gung}:latest
    container_name: vela-labs-prod
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:80"
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
