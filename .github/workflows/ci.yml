name: CI Pipeline

on:
  push:
    branches:
      - main
      - 'feature/**'
      - avis-client
  pull_request:
    branches:
      - main
      - 'feature/**'

jobs:
  build:
    name: Build & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Check build artifacts
        run: test -d dist && echo "Build completed successfully!"
