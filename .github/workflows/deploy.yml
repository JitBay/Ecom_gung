name: CD Deployment Pipeline

on:
  workflow_run:
    workflows: ["Docker CI/CD Pipeline"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Deployment Environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
      deploy_mode:
        description: 'Deployment Strategy'
        required: true
        default: 'ssh-vps'
        type: choice
        options:
          - ssh-vps
          - webhook

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # =========================================================================
  # 1. SSH VPS Deployment (Docker Compose / Docker Run)
  # =========================================================================
  deploy-vps:
    name: Deploy to VPS Server via SSH
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_mode == 'ssh-vps') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    environment:
      name: ${{ github.event.inputs.environment || 'production' }}
      url: ${{ vars.PRODUCTION_URL || 'http://localhost:8080' }}

    steps:
      - name: Verify Deployment Prerequisites
        run: |
          echo "Starting automated deployment to ${{ github.event.inputs.environment || 'production' }} environment..."
          if [ -z "${{ secrets.VPS_HOST }}" ]; then
            echo "⚠️ Notice: VPS_HOST secret is not configured yet."
            echo "To enable automated SSH deployment, configure secrets in your repository settings:"
            echo "  - VPS_HOST: Server IP address or domain name"
            echo "  - VPS_USERNAME: SSH username (e.g., ubuntu, debian, root)"
            echo "  - VPS_SSH_KEY: Private SSH key (ED25519 or RSA)"
            echo "  - VPS_PORT (optional, default 22)"
          fi

      - name: Deploy via SSH using Docker Compose
        if: ${{ secrets.VPS_HOST != '' && secrets.VPS_SSH_KEY != '' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME || 'ubuntu' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          envs: GITHUB_ACTOR,GITHUB_REPOSITORY
          script: |
            set -e
            echo "🚀 Connecting to production server..."
            
            APP_DIR="/var/www/vela-labs"
            mkdir -p $APP_DIR
            cd $APP_DIR
            
            echo "🔑 Logging in to GitHub Container Registry..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            echo "📦 Pulling latest Docker image from GHCR..."
            docker pull ghcr.io/${{ github.repository }}:latest
            
            echo "🔄 Updating running container..."
            # Stop existing container if running
            docker stop vela-labs 2>/dev/null || true
            docker rm vela-labs 2>/dev/null || true
            
            # Run new container with restart policy
            docker run -d \
              --name vela-labs \
              --restart unless-stopped \
              -p 8080:80 \
              ghcr.io/${{ github.repository }}:latest
            
            echo "🧹 Pruning old dangling images..."
            docker image prune -f
            
            echo "✅ Deployment completed successfully! Health check:"
            sleep 3
            docker ps --filter "name=vela-labs" --format "table {{.ID}}\t{{.Status}}\t{{.Ports}}"

  # =========================================================================
  # 2. Webhook Deployment (Coolify, Portainer, CapRover, Render, etc.)
  # =========================================================================
  deploy-webhook:
    name: Trigger Deploy Webhook
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_mode == 'webhook') ||
      (secrets.DEPLOY_WEBHOOK_URL != '')
    environment:
      name: ${{ github.event.inputs.environment || 'production' }}

    steps:
      - name: Trigger Webhook
        if: ${{ secrets.DEPLOY_WEBHOOK_URL != '' }}
        run: |
          echo "📡 Triggering deployment webhook for ${{ github.event.inputs.environment || 'production' }}..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${{ secrets.DEPLOY_WEBHOOK_URL }}")
          echo "HTTP response status code: $STATUS"
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 300 ]; then
            echo "✅ Webhook successfully triggered!"
          else
            echo "❌ Failed to trigger webhook. HTTP status: $STATUS"
            exit 1
          fi
