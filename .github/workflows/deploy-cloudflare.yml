name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
      - feature/ionix-clone
      - avis-cliant
      - avis-client
  workflow_dispatch:

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build static site (Vite)
        run: npm run build

      - name: Validate Cloudflare Secrets
        id: check_cf_secrets
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] && [ -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "has_secrets=true" >> $GITHUB_OUTPUT
            echo "✅ Secrets Cloudflare configurés."
          else
            echo "has_secrets=false" >> $GITHUB_OUTPUT
            echo "ℹ️ Déploiement Cloudflare Pages ignoré car CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID ne sont pas configurés dans GitHub Secrets."
          fi

      - name: Ensure Cloudflare Pages project exists
        if: steps.check_cf_secrets.outputs.has_secrets == 'true'
        run: |
          npx wrangler pages project create vela-labs --production-branch=main || true
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy to Cloudflare Pages
        if: steps.check_cf_secrets.outputs.has_secrets == 'true'
        run: |
          npx wrangler pages deploy dist --project-name=vela-labs --branch=${{ github.ref_name }} --commit-dirty=true
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
