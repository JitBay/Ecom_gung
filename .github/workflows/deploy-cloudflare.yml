name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
      - feature/ionix-clone
      - avis-cliant
      - avis-client
  workflow_dispatch:

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build static site (Vite)
        run: npm run build

      - name: Validate Cloudflare Secrets
        run: |
          MISSING=0
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "❌ ERREUR: Le secret CLOUDFLARE_API_TOKEN est absent ou vide !"
            echo "   Configurez-le dans GitHub: Settings > Secrets and variables > Actions > New repository secret"
            MISSING=1
          fi
          if [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "❌ ERREUR: Le secret CLOUDFLARE_ACCOUNT_ID est absent ou vide !"
            echo "   Configurez-le dans GitHub: Settings > Secrets and variables > Actions > New repository secret"
            MISSING=1
          fi
          if [ $MISSING -eq 1 ]; then
            exit 1
          fi
          echo "✅ Secrets Cloudflare configurés."

      - name: Ensure Cloudflare Pages project exists
        run: |
          npx wrangler pages project create vela-labs --production-branch=main || true
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy to Cloudflare Pages
        run: |
          npx wrangler pages deploy dist --project-name=vela-labs --branch=${{ github.ref_name }} --commit-dirty=true
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
